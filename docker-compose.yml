services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acmeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acmeflow}
      POSTGRES_DB: ${POSTGRES_DB:-acmeflow}
    ports:
      # Host port 5433 (not 5432) to avoid colliding with a native Postgres install.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acmeflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-acmeflow}:${POSTGRES_PASSWORD:-acmeflow}@db:5432/${POSTGRES_DB:-acmeflow}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

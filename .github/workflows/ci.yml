name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter here on purpose: a stacked PR chain has PRs whose
  # base is another open PR's branch, not `main` — restricting this to
  # `branches: [main]` means every non-final PR in a chain silently never
  # runs CI at all, not just late or cached, until it's retargeted to `main`
  # right before merging.
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mewflow
          POSTGRES_PASSWORD: mewflow
          POSTGRES_DB: mewflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mewflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mewflow:mewflow@localhost:5433/mewflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test (vitest)
        run: npm test

      - name: Typecheck and build
        run: npm run build

  backoffice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - run: npm ci

      - name: Test (vitest)
        run: npm test

      - name: Typecheck and build
        run: npm run build
